
name: Backend Automation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start FastAPI server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce
          DB_USER: admin
          DB_PASSWORD: admin
          BASE_URL: http://localhost:8000
        run: |
          uvicorn app:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &

          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "FastAPI server is ready"
              break
            fi

            echo "Waiting for FastAPI server..."
            sleep 2
          done
      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce
          DB_USER: admin
          DB_PASSWORD: admin
          BASE_URL: http://localhost:8000
        run: |
          pytest -v

